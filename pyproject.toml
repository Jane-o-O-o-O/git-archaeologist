[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-archaeologist"
version = "0.1.0"
description = "Git 仓库考古分析工具 — 挖掘代码历史，洞察仓库演变"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "gitpython>=3.1",
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
git-archaeologist = "git_archaeologist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
